name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/index.html _site/chord-diagram.html
          cp docs/chord.env _site/chord.env
          cp docs/linkage-engine-dark.png _site/linkage-engine-dark.png
          cp demo-fullsize.mov _site/demo-fullsize.mov
          cp page1.png _site/page1.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
